# Single-rotor test stand fitting config
# Fits: cl_1, cl_2, cd, alpha_0
# Uses rotor_0_sensed_wind_velocity directly for BET integration; no k_body_drag term

model:
  coarse_n_elements: 2            # number of blade elements along the span, coarse pass
  fine_n_elements: 20             # number of blade elements along the span, fine pass
  coarse_n_rotation_segments: 6   # number of azimuthal segments, coarse pass
  fine_n_rotation_segments: 18    # number of azimuthal segments, fine pass
  coarse_sample_distance: 100     # row stride for dataset subsampling, coarse pass
  fine_sample_distance: 20        # row stride for dataset subsampling, fine pass

seed:
  n_lhs: 2048       # number of Latin Hypercube samples for global screening (smaller than full-vehicle: 4-param space)
  n_keep: 16       # number of best seeds carried forward to coarse optimization
  random_seed: 42 # random seed for reproducible LHS sampling

solver:
  coarse_maxiter: 100       # max iterations, coarse stage
  fine_maxiter: 100        # max iterations, fine stage
  single_maxiter: 50       # max iterations, single-seed (coarse) run; staged fit uses this as the stage-1.5 BEMT base-refine budget
  single_fine_maxiter: 100 # max iterations, single-seed fine-tune run; staged fit uses this for the stage-2 offset fit
  ftol: 1.0e-2             # function value tolerance for convergence
  xtol: 1.0e-3             # parameter value tolerance for convergence
